services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stockroom
      MYSQL_USER: stockroom
      MYSQL_PASSWORD: stockroom
      MYSQL_ROOT_PASSWORD: local-root-password
    ports: ["3306:3306"]
    volumes: ["stockroom-mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ustockroom", "-pstockroom"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  stockroom-mysql:
